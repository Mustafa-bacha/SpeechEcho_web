version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - SECRET_KEY=your-secret-key-change-in-production
      - DATABASE_URL=sqlite:///./speechecho.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost
      - AUTH_GUEST_BYPASS=true
    volumes:
      - ./backend:/app
      - backend_static:/app/static
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - speechecho-network
    depends_on:
      - frontend

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    networks:
      - speechecho-network

  # Nginx Reverse Proxy (for production-like setup)
  # Uncomment to use
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - speechecho-network

volumes:
  backend_static:

networks:
  speechecho-network:
    driver: bridge
